<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darren Wallace | 3D Artist &amp; YouTube Creator</title>
  <meta name="description" content="3D artist">
  <meta property="og:title" content="Darren Wallace | 3D Artist &amp; YouTube Creator">
  <meta property="og:description" content="Creatures, animation and UE5 dev. 82k subscribers on YouTube.">
  <meta property="og:url" content="https://darrenwallace3d.com/">
  <meta name="theme-color" content="#0d0d10">
  <style>
    :root { --bg:#0d0d10; --card:#16161b; --text:#ececf1; --muted:#9a9aa6; --accent:#e5484d; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
      line-height:1.6;
    }
    main { width:100%; max-width:560px; text-align:center; }
    h1 { font-size:clamp(2.2rem,7vw,3.4rem); letter-spacing:.02em; font-weight:800; }
    .handle { color:var(--accent); font-weight:600; margin-top:.25rem; }
    p.bio { color:var(--muted); margin:1.5rem auto 2.25rem; max-width:44ch; font-size:1.05rem; }
    nav { display:flex; flex-direction:column; gap:.75rem; }
    nav a {
      display:block; padding:.9rem 1rem; border-radius:12px;
      background:var(--card); color:var(--text); text-decoration:none; font-weight:600;
      border:1px solid #24242b; transition:border-color .15s, transform .15s;
    }
    nav a:hover, nav a:focus-visible { border-color:var(--accent); transform:translateY(-1px); outline:none; }
    nav a.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    footer { margin-top:2.5rem; color:#5f5f6b; font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Darren Wallace</h1>
    <div class="handle">@DarrenWallace3d</div>
    <p class="bio">3D artist</p>
    <nav>
      <a class="primary" href="https://www.youtube.com/@DarrenWallace3d" target="_blank" rel="noopener">YouTube</a>
      <!-- Check this ArtStation address matches your profile -->
      <a href="https://www.artstation.com/darrenwallace3d" target="_blank" rel="noopener">ArtStation</a>
      <a href="https://x.com/DarrenWallace3d" target="_blank" rel="noopener">X</a>
      <a href="https://www.instagram.com/darrenwallace3d" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.facebook.com/DarrenWallaceArtist" target="_blank" rel="noopener">Facebook</a>
    </nav>
    <footer>&copy; <span id="y">2026</span> Darren Wallace</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
